<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة تحكم DZ SHOP</title><link rel="stylesheet" href="style.css"><style>
.adminPage{max-width:1100px;width:92%;margin:30px auto 60px}.box{background:#fff;border:1px solid #e4e9e6;border-radius:24px;padding:24px;margin-bottom:18px;box-shadow:0 10px 30px #07110c08}.muted{color:#68746d;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field label{display:block;font-weight:bold;font-size:13px;margin-bottom:7px}.field input,.field select{width:100%;box-sizing:border-box;border:1px solid #dfe6e1;border-radius:13px;padding:12px;background:#fafcfb}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.primary,.save{background:#0b7a3b;color:#fff;border:0;padding:13px 20px;border-radius:13px;font-weight:bold;cursor:pointer}.secondary{background:#eef3ef;color:#163d28;border:0;padding:11px 15px;border-radius:12px;font-weight:bold;cursor:pointer}.danger{background:#fff0f0;color:#b42318;border:1px solid #ffd0d0;padding:9px 12px;border-radius:10px;font-weight:bold;cursor:pointer}.item{border:1px solid #e8ede9;border-radius:18px;padding:14px;margin-top:12px}.head{display:flex;align-items:center;gap:12px}.head img{width:65px;height:65px;object-fit:cover;border-radius:13px}.fields{display:grid;grid-template-columns:2fr 1fr 1fr 1.3fr 1.3fr;gap:9px;margin-top:12px}.fields input{width:100%;box-sizing:border-box;border:1px solid #dfe6e1;border-radius:10px;padding:10px}.status{font-weight:bold;min-height:22px;margin-top:10px}.order{border:1px solid #e8ede9;border-radius:18px;padding:16px;margin-top:12px}.order img{max-width:180px;border-radius:12px;margin-top:10px}.badge{display:inline-block;padding:5px 9px;border-radius:9px;background:#eef3ef;font-size:12px}.link{color:#0b7a3b;font-weight:bold}@media(max-width:800px){.grid,.fields{grid-template-columns:1fr}.adminPage{width:94%}}
</style></head><body>
<div id="login" style="position:fixed;inset:0;background:#07110c;display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px"><div style="background:#fff;width:min(430px,100%);padding:28px;border-radius:24px;text-align:center"><div style="font-size:42px">🔐</div><h2>دخول لوحة التحكم</h2><p class="muted">استعمل حساب Supabase الخاص بالمدير.</p><input id="email" type="email" placeholder="البريد الإلكتروني" style="width:100%;box-sizing:border-box;padding:14px;border:1px solid #dfe6e1;border-radius:13px;margin:7px 0"><input id="password" type="password" placeholder="كلمة السر" style="width:100%;box-sizing:border-box;padding:14px;border:1px solid #dfe6e1;border-radius:13px;margin:7px 0"><button id="loginBtn" class="primary" style="width:100%">دخول</button><div id="loginError" class="status" style="color:#c62828"></div></div></div>
<div id="app" style="display:none"><div class="top">🇩🇿 DZ SHOP • لوحة التحكم</div><div class="adminPage"><a class="link" href="index.html">← العودة إلى المتجر</a>
<section class="box"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h1>📦 إدارة المنتجات</h1><p class="muted">أي منتج تضيفه هنا يظهر لجميع زبائن الموقع.</p></div><button id="logout" class="secondary">تسجيل الخروج</button></div>
<div class="grid"><div class="field"><label>اسم المنتج *</label><input id="name" placeholder="iPhone 15 Pro"></div><div class="field"><label>التصنيف</label><select id="category"><option value="electronics">إلكترونيات</option><option value="phones">هواتف</option><option value="home">المنزل</option><option value="gaming">Gaming</option><option value="auto">السيارات</option><option value="fashion">أزياء</option><option value="other">أخرى</option></select></div><div class="field"><label>السعر *</label><input id="price" type="number" min="0"></div><div class="field"><label>السعر القديم</label><input id="old_price" type="number" min="0"></div><div class="field"><label>الشارة</label><input id="tag" placeholder="جديد / عرض"></div><div class="field"><label>رابط الصورة *</label><input id="image_url" type="url" placeholder="https://..."></div><div class="field"><label>رابط Binance Pay</label><input id="binance_pay_url" type="url" placeholder="https://pay.binance.com/..."></div></div>
<div class="actions"><button id="add" class="save">➕ إضافة المنتج</button></div><div id="productStatus" class="status"></div><div id="products"></div></section>
<section class="box"><h2>💳 الدفع والتوصيل</h2><div class="grid"><div class="field"><label>1 USDT = كم دج؟</label><input id="usdt_dzd" type="number" step=".01"></div><div class="field"><label>التوصيل مجاني عند تجاوز (USDT)</label><input id="free_threshold" type="number" step=".01"></div><div class="field"><label>التوصيل العادي (دج)</label><input id="shipping" type="number"></div></div><div class="actions"><button id="saveSettings" class="save">💾 حفظ</button></div><div id="settingsStatus" class="status"></div></section>
<section class="box"><h2>📋 الطلبات</h2><div id="orders"></div></section>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://aepywoejzaqtlbdexdba.supabase.co","sb_publishable_awJkvMcHjngOOI1fAfpQWA_dKnNFxiN");
const $=id=>document.getElementById(id);let current=null,products=[];
function show(){ $("login").style.display="none";$("app").style.display="block";loadAll();}
async function login(){const {data,error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error)return $("loginError").textContent="❌ بيانات الدخول غير صحيحة.";current=data.user;if(current?.app_metadata?.role!=="admin"){await db.auth.signOut();return $("loginError").textContent="❌ الحساب ليس مديرًا.";};show();}
$("loginBtn").onclick=login;$("password").addEventListener("keydown",e=>{if(e.key==="Enter")login()});$("logout").onclick=async()=>{await db.auth.signOut();location.reload()};
async function loadAll(){await Promise.all([loadProducts(),loadSettings(),loadOrders()])}
async function loadProducts(){const {data,error}=await db.from("products").select("*").order("sort_order").order("created_at");if(error)return $("productStatus").textContent="❌ "+error.message;products=data||[];renderProducts()}
function renderProducts(){$("products").innerHTML=products.map(p=>`<div class="item"><div class="head"><img src="${p.image_url||''}" alt=""><div><b>${p.name}</b><div class="muted">${Number(p.price).toLocaleString("fr-DZ")} دج • ${p.category}</div></div><button class="danger" onclick="del('${p.id}')">🗑️ حذف</button></div><div class="fields"><input id="n-${p.id}" value="${p.name}"><input id="p-${p.id}" type="number" value="${p.price}"><input id="o-${p.id}" type="number" value="${p.old_price||0}"><input id="i-${p.id}" value="${p.image_url||''}"><input id="b-${p.id}" value="${p.binance_pay_url||''}" placeholder="Binance Pay"></div><div class="actions"><button class="secondary" onclick="edit('${p.id}')">💾 حفظ التعديل</button></div></div>`).join("")||'<p class="muted">لا توجد منتجات.</p>'}
async function edit(id){const p=products.find(x=>x.id===id);const payload={name:$("n-"+id).value.trim(),price:Number($("p-"+id).value)||0,old_price:Number($("o-"+id).value)||0,image_url:$("i-"+id).value.trim(),binance_pay_url:$("b-"+id).value.trim()};const {error}=await db.from("products").update(payload).eq("id",id);$("productStatus").textContent=error?"❌ "+error.message:"✅ تم حفظ المنتج.";if(!error)loadProducts()}
async function del(id){if(!confirm("حذف المنتج؟"))return;const {error}=await db.from("products").delete().eq("id",id);$("productStatus").textContent=error?"❌ "+error.message:"✅ تم حذف المنتج.";if(!error)loadProducts()}
$("add").onclick=async()=>{const payload={name:$("name").value.trim(),category:$("category").value,price:Number($("price").value)||0,old_price:Number($("old_price").value)||0,tag:$("tag").value.trim()||"جديد",image_url:$("image_url").value.trim(),binance_pay_url:$("binance_pay_url").value.trim(),active:true,sort_order:products.length+1};if(!payload.name||!payload.price||!payload.image_url)return $("productStatus").textContent="❌ الاسم والسعر والصورة مطلوبة.";const {error}=await db.from("products").insert(payload);$("productStatus").textContent=error?"❌ "+error.message:"✅ تمت إضافة المنتج للجميع.";if(!error){["name","price","old_price","tag","image_url","binance_pay_url"].forEach(x=>$(x).value="");loadProducts()}}
async function loadSettings(){const {data}=await db.from("store_settings").select("*").eq("id","main").maybeSingle();$("usdt_dzd").value=data?.usdt_dzd||256;$("free_threshold").value=data?.free_shipping_threshold_usdt??10;$("shipping").value=data?.shipping_dzd??0}
$("saveSettings").onclick=async()=>{const {error}=await db.from("store_settings").update({usdt_dzd:Number($("usdt_dzd").value)||256,free_shipping_threshold_usdt:Number($("free_threshold").value)||10,shipping_dzd:Math.max(0,Number($("shipping").value)||0),updated_at:new Date().toISOString()}).eq("id","main");$("settingsStatus").textContent=error?"❌ "+error.message:"✅ تم حفظ الإعدادات للجميع."}
async function loadOrders(){const {data,error}=await db.from("orders").select("*,order_items(*)").order("created_at",{ascending:false});if(error)return $("orders").innerHTML='<p class="muted">لا يمكن تحميل الطلبات.</p>';$("orders").innerHTML=(data||[]).map(o=>`<div class="order"><b>طلب ${o.id.slice(0,8)}</b> <span class="badge">${o.status}</span><p>📱 ${o.phone} • 📍 ${o.wilaya} • ✉️ ${o.email}</p><p>💰 ${Number(o.total).toLocaleString("fr-DZ")} دج</p><div>${(o.order_items||[]).map(i=>`<div>${i.product_name} × ${i.quantity} — ${Number(i.subtotal).toLocaleString("fr-DZ")} دج</div>`).join("")}</div>${o.payment_proof_url?'<p>📷 إثبات الدفع: <a class="link" target="_blank" href="'+o.payment_proof_url+'">فتح الصورة</a></p>':''}<div class="actions"><button class="secondary" onclick="statusOrder('${o.id}','confirmed')">✅ تأكيد</button><button class="danger" onclick="statusOrder('${o.id}','cancelled')">❌ إلغاء</button></div></div>`).join("")||'<p class="muted">لا توجد طلبات بعد.</p>'}
async function openProof(path){const {data,error}=await db.storage.from("payment-proofs").createSignedUrl(path,3600);if(error||!data?.signedUrl)return alert("تعذر فتح إثبات الدفع.");window.open(data.signedUrl,"_blank")}async function statusOrder(id,status){const {error}=await db.from("orders").update({status}).eq("id",id);if(!error)loadOrders()}
(async()=>{const {data:{session}}=await db.auth.getSession();if(session){current=session.user;if(current?.app_metadata?.role==="admin")show();}})();
</script></body></html>
